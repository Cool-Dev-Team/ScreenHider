<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen Hider</title>
<link href="https://fonts.cdnfonts.com/css/inter" rel="stylesheet">

<style>
/* ---------------------------------------------------- */
/* 1. Global styling & colours                      */
:root{
  --font:'Inter',sans-serif;
  --radius:6px;
  --wrapper:680px;
  --bg:#fafafa;
  --primary:#28a745;
  --primary-d:#218838;
  --white:#fff;
  --gray:#f6f6f6;
  --dark:#222;
  --red:#d32f2f;
  --blue:#1976d2;
  --purple:#7b1fa2;
}
body.dark{
  --bg:#222;
  --dark:#fafafa;
  --white:#222;
  --gray:#333;
}

/* ---------------------------------------------------- */
/* 2. Reset & base layout                             */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);
      color:var(--dark);display:flex;justify-content:center;
      align-items:center;min-height:100vh;overflow:hidden;}
ul{list-style:disc;padding-left:1.3rem;}

/* ---------------------------------------------------- */
/* 3. Login card                                      */
.card{
  position:relative;                           /* allows the toggle button to sit above */
  background:var(--white);border-radius:var(--radius);
  box-shadow:0 4px 12px rgba(0,0,0,.08);padding:2rem;
  width:100%;max-width:440px;text-align:center;
  transition:background .3s,box-shadow .3s;
}
h2{margin-bottom:1rem;font-size:1.8rem;color:var(--primary);}
h3{margin:.7rem 0;font-size:.95rem;color:#555;}
.input{
  width:100%;padding:.8rem 1rem;margin:1rem 0;
  font-size:.95rem;border:1px solid #ccc;border-radius:var(--radius);
  transition:border-color .2s,box-shadow .2s;
}
.input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 4px var(--primary);
}
.btn{
  width:100%;padding:.8rem 1rem;font-size:.95rem;
  color:#fff;background:var(--primary);border:none;
  border-radius:var(--radius);cursor:pointer;
  transition:background .2s,transform .1s;
}
.btn:hover{background:var(--primary-d);transform:scale(1.02);}

/* Theme toggle button (small) */
button.smallBtn{
  background:#6c757d;color:#fff;padding:.4rem .8rem;
  border:none;border-radius:6px;margin:0 .3rem;
  cursor:pointer;font-size:.85rem;
}
button.smallBtn:hover{background:#5a6268;}
#msg{min-height:1.8rem;margin-top:.75rem;padding:.5rem 1rem;
      border-radius:var(--radius);font-size:.9rem;
      display:flex;justify-content:center;align-items:center;}
#msg.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
/* ---------------------------------------------------- */
/* 4. Loading spinner                                 */
#spinner{
  display:none;margin:1rem auto;text-align:center;
}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
/* ---------------------------------------------------- */
/* 5. Post‑login wrapper                              */
#wrapper{max-width:var(--wrapper);margin:auto;display:flex;
         flex-direction:column;align-items:center;gap:1rem;}
pre{background:var(--gray);border-radius:4px;padding:.5rem;
    width:90%;overflow-x:auto;white-space:pre-wrap;}
input.urlInput{
  width:90%;border-radius:4px;border:1px solid #ccc;
  padding:.45rem;margin:.5rem 0;font-size:.95rem;
}
.tier{
  display:inline-block;padding:.25rem .65rem;margin:6px 0;
  color:#fff;font-size:.75rem;border-radius:4px;
}
.tier.overlord{background:var(--red);}
.tier.standard{background:var(--blue);}
.tier.friend{background:var(--purple);}
.tier.gold{background:#ffc107;}
.tier.silver{background:#cfd8dc;}
.tier.bronze{background:#795548;}
.features{
  width:90%;text-align:left;max-width:500px;
  background:var(--gray);border-radius:6px;padding:1rem;
  box-shadow:0 2x8px rgba(0,0,0,.05);
}
.features h4{margin-bottom:.5rem;}
.features ul{margin:0;}
/* ---------------------------------------------------- */
/* 6. Key Vault styling                               */
#vault{background:#f9f9f9;border-radius:6px;padding:1rem;
       box-shadow:0 2px 6px rgba(0,0,0,.1);display:none;max-width:440px;}
#vault h3{margin-bottom:.8rem;font-size:1.2rem;color:var(--primary);}
#vault ul{max-height:200px;overflow-y:auto;margin-top:1rem;
          list-style:none;padding:0;}
.keyItem{
  display:flex;justify-content:space-between;align-items:center;
  padding:.4rem .6rem;border-radius:4px;margin:4px 0;
  background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.keyName{font-weight:600;}
.keyDetails{font-size:.9rem;color:#555;margin-left:1rem;}
.keyItem button{
  background:#e53935;color:#fff;font-size:.7rem;padding:.2rem .4rem;
  border:none;border-radius:4px;cursor:pointer;
}
.keyItem button:hover{background:#d32f2f;}
/* ---------------------------------------------------- */
/* 7. Watermark container for the main page (kept for reference) */
</style>
</head>
<body>
<!-- ------------------------------------------ -->
<!-- 1. Login card (shown before auth) -->
<div class="card" id="auth">
  <h2>Authenticate</h2>
  <!-- Theme toggle button (top‑right) -->
  <button id="themeToggle" class="smallBtn" title="Toggle theme">🌙</button>
  <h3>If you want a key, email</h3>
  <h3>5137455873@student.cms.k12.nc.us</h3>
  <h3>(I NEED A KEY) and he will get back to you as soon as he can</h3>
  <input type="text" id="keyInput" class="input" placeholder="Enter your key">
  <button id="authBtn" class="btn">Authenticate</button>
  <div id="msg" role="alert"></div>
</div>

<!-- ------------------------------------------ -->
<!-- 2. Loading spinner -->
<div id="spinner">
  <svg width="32" height="32" viewBox="0 0 50 50" style="animation:spin .7s linear infinite;">
    <circle cx="25" cy="25" r="20" fill="none" stroke="#28a745" stroke-width="6"/>
  </svg>
</div>

<script>
/* ------------------------------------------ */
/* 3. RANK and USER data (extendable) */
/* ------------------------------------------ */
const RANKS = [
  {id:"overlord", name:"Overlord",
   features:["Unlimited access", "Priority support", "2FA by default", "Custom branding"]},
  {id:"standard", name:"Standard",
   features:["Core modules", "48‑h support", "Basic analytics"]},
  {id:"friend",   name:"Friend",
   features:["Limited modules", "Community forums", "No priority"]},
  /* New ranks – these also get a watermark (they’re “bad”) */
  {id:"gold",     name:"Gold",
   features:["Priority support", "Advanced analytics"]},
  {id:"silver",   name:"Silver",
   features:["Basic analytics", "Community support"]},
  {id:"bronze",   name:"Bronze",
   features:["Basic modules", "Community forums"]},
];
const USERS = [
  {name:"Fischer", tier:"overlord", rank:"overlord"},
  {name:"Colton",  tier:"overlord", rank:"overlord"},
  {name:"Brantley",tier:"overlord", rank:"overlord"},
  {name:"Joseph",  tier:"overlord", rank:"overlord"},
  {name:"Cove",    tier:"overlord", rank:"overlord"},
  {name:"Breilyn", tier:"standard", rank:"standard"},
  /* Example of a custom rank */
  {name:"Alex",    tier:"friend",   rank:"friend"},
];

/* ------------------------------------------ */
/* 4. SHA‑256 helper (async) */
/* ------------------------------------------ */
async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash))
    .map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ------------------------------------------ */
/* 5. Open arbitrary URL in about:blank tab
   watermarkEnabled – true if page should carry watermark
   watermarkRank – the rank name that should appear next to the watermark   */
/* ------------------------------------------ */
function openCustomPage(url, watermarkEnabled, watermarkRank){
  if (!url){alert('Please enter a URL first.');return;}
  const win = window.open('about:blank','_blank');
  if (!win){
    alert('Pop‑ups are blocked. Allow them to continue.');
    return;
  }
  const watermarkHTML = watermarkEnabled ?
`<div id="wmContainer">
   <div id="wm">FISCHY HIDER</div>
   <span class="wmRank">${watermarkRank}</span>
 </div>` : '';

  win.document.write(`
  <!doctype html>
  <html lang="en"><head>
    <meta charset="utf-8">
    <title>Custom Page</title>
    <style>
      html,body{margin:0;padding:0;font-family:Inter,sans-serif;background:#fff;}
      iframe{border:none;width:100%;height:100vh;}
      /* Watermark on the RIGHT HAND side of the page */
      #wmContainer{
        position:fixed;top:50%;right:10px;transform:translateY(-50%);
        display:flex;align-items:center;z-index:9999;
      }
      #wm{
        font-size:48px;color:rgba(200,200,200,.6);
        transform:rotate(90deg);font-weight:bold;
      }
      .wmRank{
        font-size:20px;color:#222;margin-left:15px;
        transform:rotate(-90deg); /* cancel parent rotation */
      }
    </style>
  </head>
  <body>
    ${watermarkHTML}
    <iframe src="${url}"></iframe>
  </body>
  </html>
  `);
  win.document.close();
}

/* ------------------------------------------ */
/* 6. Key Vault (client‑side only) */
/* ------------------------------------------ */
function loadVault(){return localStorage.getItem('keyVault')? JSON.parse(localStorage.getItem('keyVault')): [];}
function saveVault(v){localStorage.setItem('keyVault',JSON.stringify(v));}
function renderVault(){
  const vault = loadVault();
  const ul = document.getElementById('keyList');
  ul.innerHTML='';
  vault.forEach((k, idx)=>{
    const li=document.createElement('li');li.className='keyItem';
    li.innerHTML=`<strong class="keyName">${k.name||'Unnamed'}</strong>
                  <span class="keyDetails">${k.tier} – added ${new Date(k.addedAt).toLocaleString()}</span>
                  <button class="delBtn" data-i="${idx}" title="Remove">&times;</button>`;
    ul.appendChild(li);
  });
}
function promptAddKey(){
  const raw = prompt('Enter the key you want to store (leave blank to cancel)');
  if (!raw) return;
  const name = prompt('Optional: give this key a name')||'';
  if (!/^[a-f0-9]{64}$/.test(raw)){
    alert('Invalid key – it must be 64 hexadecimal characters.');
    return;
  }
  const tier = raw.split('_')[0]||'Standard';
  const vault = loadVault();
  vault.push({hash:raw, name, tier, addedAt:Date.now()});
  saveVault(vault);
  renderVault();
}
function deleteKey(i){
  if (!confirm('Delete this key?')) return;
  const vault=loadVault();
  vault.splice(i,1);
  saveVault(vault);
  renderVault();
}

/* ------------------------------------------ */
/* 7. Show welcome page after auth */
/* ------------------------------------------ */
async function showWelcome(user, loggedAsFriend){
  const friendKey = await sha256Hex(user.name+"_Friend_Key");
  const title = loggedAsFriend ? `${user.name} – Friend` : user.name;
  const rank  = RANKS.find(r=>r.id===user.rank)||{name:"Unknown",features:[]};

  const keyBlock = loggedAsFriend ? '' : `
    <h3>Your key (Friend key to use):</h3>
    <pre id="friendKey">${friendKey}</pre>
    <button class="smallBtn" id="copyFriendBtn">Copy Key</button>
  `;
  const featList = rank.features.map(f=>`<li>${f}</li>`).join('');
  const featureBlock = `
    <div class="features">
      <h4>Tier Features (${rank.name})</h4>
      <ul>${featList}</ul>
    </div>
  `;

  /* -------- watermark logic -------- */
  const goodRanks = ['overlord'];           // ranks that can toggle watermark
  const isGood = goodRanks.includes(user.rank);
  let wmEnabled = false;                     // initial value: off

  document.body.innerHTML = `
  <div id="wrapper">
    <h1>Welcome, ${title}!</h1>
    <h2>Tier: <span class="tier ${user.rank}">${rank.name}</span></h2>
    ${keyBlock}
    <input type="text" id="urlInput" class="urlInput" placeholder="Enter a URL to view in about:blank">
    <button class="smallBtn" id="openUrlBtn">Open URL in about:blank</button>
    <div style="margin-top:1rem;">
      <p>This rank ${isGood?'can toggle the watermark':'always shows a watermark'}.</p>
    </div>
    ${featureBlock}
    <button class="smallBtn" id="againBtn">Authenticate again</button>
  </div>
  <div id="vault">
    <h3>My Key Vault</h3>
    <button class="smallBtn" id="addKeyBtn">Add Key</button>
    <ul id="keyList"></ul>
  </div>
  `;

  /* watermark for bad ranks (always on) */
  if (!isGood){
    // no toggle; watermark will always be on in any about:blank opened
  }

  /* toggle button for good ranks */
  if (isGood){
    const toggleBtn=document.createElement('button');
    toggleBtn.className='smallBtn';
    toggleBtn.textContent='Show Watermark';
    toggleBtn.onclick=()=>{
      wmEnabled=!wmEnabled;
      toggleBtn.textContent= wmEnabled? 'Hide Watermark':'Show Watermark';
    };
    document.getElementById('wrapper').appendChild(toggleBtn);
  }

  if (!loggedAsFriend){
    document.getElementById('copyFriendBtn').onclick=()=>{
      navigator.clipboard.writeText(friendKey)
        .then(()=>alert('Key copied!'));
    };
  }

  document.getElementById('openUrlBtn').onclick=()=>{
    const url=document.getElementById('urlInput').value.trim();
    // Pass the watermark flag on the about:blank page
    openCustomPage(url, !isGood || wmEnabled, rank.name);
  };

  renderVault();
  document.getElementById('addKeyBtn').onclick=promptAddKey;
  document.getElementById('keyList').addEventListener('click',e=>{
    if (e.target.classList.contains('delBtn')){
      deleteKey(parseInt(e.target.dataset.i));
    }
  });
  document.getElementById('againBtn').onclick=()=>location.reload();
}

/* ------------------------------------------ */
/* 9. Calma‑login flow */
/* ------------------------------------------ */
async function doLogin(){
  const key=document.getElementById('keyInput').value.trim();
  const msg=document.getElementById('msg');
  const sp=document.getElementById('spinner');

  if (!key){msg.className='error';msg.textContent='Enter a key.';return;}
  sp.style.display='block';msg.className='';

  let matched=null;
  for(const u of USERS){
    const main = await sha256Hex(u.name);
    const friend = await sha256Hex(u.name+"_Friend_Key");
    if(main===key){matched={...u,loggedAsFriend:false};break;}
    if(friend===key){matched={...u,loggedAsFriend:true};break;}
  }

  sp.style.display='none';
  if (!matched){msg.className='error';msg.textContent='❌ Wrong key.';return;}

  showWelcome(matched, matched.loggedAsFriend);
}

/* ------------------------------------------ */
/* 10. Theme switcher (light <-> dark) */
/* ------------------------------------------ */
function updateThemeIcon(){
  const icon = document.body.classList.contains('dark') ? '☀️' : '🌙';
  document.getElementById('themeToggle').textContent = icon;
}
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  updateThemeIcon();
}
window.addEventListener('load', () => {
  if(localStorage.getItem('darkMode')==='true') toggleTheme();
  else updateThemeIcon();
});
document.getElementById('themeToggle').onclick = toggleTheme;

/* ------------------------------------------ */
/* 11. Hook up event listeners */
/* ------------------------------------------ */
document.getElementById('authBtn').onclick=doLogin;
document.getElementById('keyInput').addEventListener('keydown',e=>{
  if (e.key==='Enter'){doLogin();e.preventDefault();}
});
</script>
</body>
</html>
